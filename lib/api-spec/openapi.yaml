openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: news
    description: Official Alifta news feed
  - name: hadiths
    description: Hadith corpus search and detail operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List the latest official Alifta news
      responses:
        "200":
          description: Latest official news, or an internal fallback feed when Alifta is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeed"
  /hadiths:
    get:
      operationId: listHadiths
      tags: [hadiths]
      summary: Search hadith corpus
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/NarratorId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated hadith search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HadithPage"
  /hadiths/{id}:
    get:
      operationId: getHadith
      tags: [hadiths]
      summary: Get hadith detail
      parameters:
        - $ref: "#/components/parameters/HadithId"
      responses:
        "200":
          description: Hadith detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hadith"
        "404":
          $ref: "#/components/responses/NotFound"
  /books:
    get:
      operationId: listHadithBooks
      tags: [hadiths]
      summary: List source books
      responses:
        "200":
          description: Source books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HadithBook"
  /narrators:
    get:
      operationId: listNarrators
      tags: [hadiths]
      summary: Search narrators
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated narrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarratorPage"
  /narrators/{id}:
    get:
      operationId: getNarrator
      tags: [hadiths]
      summary: Get narrator profile
      parameters:
        - $ref: "#/components/parameters/NarratorIdPath"
      responses:
        "200":
          description: Narrator detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Narrator"
        "404":
          $ref: "#/components/responses/NotFound"
  /narrators/{id}/hadiths:
    get:
      operationId: listNarratorHadiths
      tags: [hadiths]
      summary: List hadiths narrated by a narrator
      parameters:
        - $ref: "#/components/parameters/NarratorIdPath"
      responses:
        "200":
          description: Narrator hadiths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HadithPage"
components:
  parameters:
    Query:
      name: query
      in: query
      required: false
      schema: { type: string }
    BookId:
      name: bookId
      in: query
      required: false
      schema: { type: string }
    NarratorId:
      name: narratorId
      in: query
      required: false
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    HadithId:
      name: id
      in: path
      required: true
      schema: { type: string }
    NarratorIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    NewsItem:
      type: object
      required: [id, title, excerpt, category, publishedAt, url]
      properties:
        id: { type: integer }
        title: { type: string }
        excerpt: { type: string }
        category: { type: string }
        publishedAt: { type: string }
        url: { type: string, format: uri }
    NewsFeed:
      type: object
      required: [items, isFallback]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        isFallback: { type: boolean }
    HadithBook:
      type: object
      required: [id, title, author, description, hadithCount]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        hadithCount: { type: integer }
    Narrator:
      type: object
      required: [id, name, generation, reliability, bio, hadithCount]
      properties:
        id: { type: string }
        name: { type: string }
        generation: { type: string }
        reliability: { type: string }
        bio: { type: string }
        hadithCount: { type: integer }
    Hadith:
      type: object
      required:
        [id, bookId, bookName, chapter, number, textAr, grade, sourceNarrators]
      properties:
        id: { type: string }
        bookId: { type: string }
        bookName: { type: string }
        chapter: { type: string }
        number: { type: integer }
        textAr: { type: string }
        grade: { type: string }
        sourceNarrators:
          type: array
          items:
            $ref: "#/components/schemas/Narrator"
    HadithPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Hadith"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    NarratorPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Narrator"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

